<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 440" width="100%" height="100%">
  <style>
    .title { font-family: 'Fira Code', monospace; font-size: 14.5px; font-weight: bold; fill: #10b981; }
    .key { font-family: 'Fira Code', monospace; font-size: 12.5px; font-weight: bold; fill: #10b981; }
    .val { font-family: 'Fira Code', monospace; font-size: 12.5px; fill: #cbd5e1; }
    .divider { font-family: 'Fira Code', monospace; font-size: 12.5px; fill: #30363d; }
    .quote { font-family: 'Fira Code', monospace; font-size: 11.5px; fill: #e65f2b; font-style: italic; }
    
    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-line {
      opacity: 0;
      animation: fadeInSlide 0.35s ease-out forwards;
    }
      .line-0 { animation-delay: 0.08s; }
      .line-1 { animation-delay: 0.15s; }
      .line-2 { animation-delay: 0.22s; }
      .line-3 { animation-delay: 0.29s; }
      .line-4 { animation-delay: 0.36s; }
      .line-5 { animation-delay: 0.43s; }
      .line-6 { animation-delay: 0.50s; }
      .line-7 { animation-delay: 0.57s; }
      .line-8 { animation-delay: 0.64s; }
      .line-9 { animation-delay: 0.71s; }
      .line-10 { animation-delay: 0.78s; }
      .line-11 { animation-delay: 0.85s; }
      .line-12 { animation-delay: 0.92s; }
      .line-13 { animation-delay: 0.99s; }
      .line-14 { animation-delay: 1.06s; }
  </style>

  <rect width="100%" height="100%" fill="#0b0f19" rx="8" stroke="#1f2937" stroke-width="1.5"/>

  <g class="animate-line line-0">
    <text x="22" y="34" class="title">ar1es-xd</text>
    <text x="96" y="34" class="val">@</text>
    <text x="108" y="34" class="title">github</text>
  </g>
  <g class="animate-line line-1">
    <text x="22" y="57" class="divider">--------------------</text>
  </g>
  <g class="animate-line line-2">
    <text x="22" y="80" class="key">OS:</text>
    <text x="110" y="80" class="val">macOS Sequoia 15.0</text>
  </g>
  <g class="animate-line line-3">
    <text x="22" y="103" class="key">Host:</text>
    <text x="110" y="103" class="val">GitHub Profile</text>
  </g>
  <g class="animate-line line-4">
    <text x="22" y="126" class="key">Kernel:</text>
    <text x="110" y="126" class="val">Darwin 24.0.0 (Apple Silicon)</text>
  </g>
  <g class="animate-line line-5">
    <text x="22" y="149" class="key">Shell:</text>
    <text x="110" y="149" class="val">zsh 5.9</text>
  </g>
  <g class="animate-line line-6">
    <text x="22" y="172" class="key">Focus:</text>
    <text x="110" y="172" class="val">Distributed Systems / AI Agents</text>
  </g>
  <g class="animate-line line-7">
    <text x="22" y="195" class="key">Now:</text>
    <text x="110" y="195" class="val">Training ESM-Mamba &amp; AI codebots</text>
  </g>
  <g class="animate-line line-8">
    <text x="22" y="218" class="key">Prev:</text>
    <text x="110" y="218" class="val">Full-stack &amp; automation dev</text>
  </g>
  <g class="animate-line line-9">
    <text x="22" y="241" class="key">Stack:</text>
    <text x="110" y="241" class="val">Python, JS/TS, Next.js, PyTorch</text>
  </g>
  <g class="animate-line line-10">
    <text x="22" y="264" class="key">Projects:</text>
    <text x="110" y="264" class="val">Algora, EmpowerMe, Task Tracker</text>
  </g>
  <g class="animate-line line-11">
    <text x="22" y="287" class="key">Status:</text>
    <text x="110" y="287" class="val">Active (clean state, 0 errors)</text>
  </g>
  <g class="animate-line line-12">
    <text x="22" y="310" class="divider">--------------------</text>
  </g>
  <g class="animate-line line-13">
    <text x="22" y="333" class="quote">&quot;Truth is ever to be found in simplicity,&quot;</text>
    <text x="22" y="350" class="quote">&quot;and not in confusion.&quot; — Sir Isaac Newton</text>
  </g>
  <g class="animate-line line-14">
    <rect x="22" y="374" width="22" height="14" fill="#161b22" rx="2"/>
    <rect x="50" y="374" width="22" height="14" fill="#0e4429" rx="2"/>
    <rect x="78" y="374" width="22" height="14" fill="#006d32" rx="2"/>
    <rect x="106" y="374" width="22" height="14" fill="#26a641" rx="2"/>
    <rect x="134" y="374" width="22" height="14" fill="#39d353" rx="2"/>
    <rect x="162" y="374" width="22" height="14" fill="#69f0a0" rx="2"/>
    <rect x="190" y="374" width="22" height="14" fill="#10b981" rx="2"/>
    <rect x="218" y="374" width="22" height="14" fill="#e65f2b" rx="2"/>
  </g>
</svg>
