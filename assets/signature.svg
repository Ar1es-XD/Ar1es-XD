<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="120" style="background:transparent; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <style>
    .node-text { fill: #64748B; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; }
    .node-label { fill: #E65F2B; font-size: 12px; font-weight: 700; letter-spacing: 0.05em; }
    .pulse-line { stroke: #64748B; stroke-width: 1.5; stroke-dasharray: 6, 4; animation: dash 20s linear infinite; }
    .signal { fill: #10B981; animation: ping 3s cubic-bezier(0, 0, 0.2, 1) infinite; }
    @keyframes dash {
      to { stroke-dashoffset: -100; }
    }
    @keyframes ping {
      0% { r: 3; opacity: 1; }
      100% { r: 12; opacity: 0; }
    }
    @media (prefers-color-scheme: dark) {
      .node-text { fill: #94A3B8; }
      .pulse-line { stroke: #334155; }
    }
  </style>
  <!-- Node Connections -->
  <path d="M 120 60 L 300 60" class="pulse-line" />
  <path d="M 300 60 L 480 60" class="pulse-line" />
  <path d="M 480 60 C 390 100, 210 100, 120 60" class="pulse-line" fill="none" />
  
  <!-- Signals -->
  <circle cx="210" cy="60" r="4" fill="#10B981" />
  <circle cx="390" cy="60" r="4" fill="#06B6D4" />
  
  <!-- Node 1: Generator -->
  <g transform="translate(120, 60)">
    <circle cx="0" cy="0" r="24" fill="#0F172A" stroke="#E65F2B" stroke-width="2" />
    <circle cx="0" cy="0" r="6" class="signal" />
    <circle cx="0" cy="0" r="4" fill="#E65F2B" />
    <text x="0" y="42" text-anchor="middle" class="node-label">GENERATOR</text>
    <text x="0" y="-34" text-anchor="middle" class="node-text">Agentic Loops</text>
  </g>
  
  <!-- Node 2: State -->
  <g transform="translate(300, 60)">
    <circle cx="0" cy="0" r="24" fill="#0F172A" stroke="#10B981" stroke-width="2" />
    <circle cx="0" cy="0" r="6" class="signal" />
    <circle cx="0" cy="0" r="4" fill="#10B981" />
    <text x="0" y="42" text-anchor="middle" class="node-label" style="fill: #10B981;">STATE</text>
    <text x="0" y="-34" text-anchor="middle" class="node-text">Distributed Sync</text>
  </g>
  
  <!-- Node 3: Runtime -->
  <g transform="translate(480, 60)">
    <circle cx="0" cy="0" r="24" fill="#0F172A" stroke="#06B6D4" stroke-width="2" />
    <circle cx="0" cy="0" r="6" class="signal" />
    <circle cx="0" cy="0" r="4" fill="#06B6D4" />
    <text x="0" y="42" text-anchor="middle" class="node-label" style="fill: #06B6D4;">RUNTIME</text>
    <text x="0" y="-34" text-anchor="middle" class="node-text">Premium UX</text>
  </g>
</svg>
